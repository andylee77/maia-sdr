<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1116">
<title>Fishball P25</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314a3a3'/%3E%3Cpath d='M9 22V10h7a4 4 0 010 8H9' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Ccircle cx='23' cy='22' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="ui/{{BUILD}}/css/base.css">
<link rel="stylesheet" href="ui/{{BUILD}}/css/components.css">
<script type="module" src="ui/{{BUILD}}/js/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Fishball P25</div>
  <div class="topbar-site" id="top-site" title="Control channel">
    <span class="dot" id="top-site-dot"></span><span id="top-site-text">connecting&hellip;</span>
  </div>
  <div class="topbar-right">
    <span class="conn" id="conn" title="Connection to the radio"></span>
    <input type="range" class="vol" id="vol" min="0" max="200" step="5" value="100" aria-label="Live audio volume" title="Volume 100%">
    <button type="button" class="chip" id="norm-btn" aria-pressed="true" title="Volume normalization: evens out loud and quiet talkers">Level</button>
    <button type="button" class="btn btn-listen" id="listen-btn" aria-pressed="false">Listen</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Views">
  <a href="#now" data-view="now"><span class="tab-ico" aria-hidden="true">&#9679;</span>Now</a>
  <a href="#radio" data-view="radio"><span class="tab-ico" aria-hidden="true">&#8776;</span>Radio</a>
  <a href="#diag" data-view="diag"><span class="tab-ico" aria-hidden="true">&#9636;</span>Diagnostics</a>
  <a href="#settings" data-view="settings"><span class="tab-ico" aria-hidden="true">&#9881;</span>Settings</a>
</nav>
<div class="banner" id="banner" hidden></div>
<main id="view" class="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>
<noscript>
  <p class="noscript">This page needs JavaScript.</p>
</noscript>
</body>
</html>
