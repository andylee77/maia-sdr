[package]
name = "scanner"
version = "0.1.0"
edition = "2021"
# The Rust of the Tezuka image build (Buildroot 2025.05).
rust-version = "1.86"
authors = ["Andy Lee"]
description = "Fishball scanner: P25 and DMR trunking on the Fishball Z7020"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
p25-pac = { path = "../p25-httpd/p25-pac" }
paste = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["ioctl"] }
page_size = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
